name: Check

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  check:
    name: check (${{ matrix.os }})
    strategy:
      matrix:
        os: [ ubuntu-latest, xcode-27 ]
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Metal toolchain
        if: runner.os == 'macOS'
        run: xcrun -sdk macosx metal --version || xcodebuild -downloadComponent MetalToolchain

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true

      - name: Run tests
        run: cargo test --locked --verbose

      - name: Smoke check
        run: cargo run --locked -- --version
