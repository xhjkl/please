name: Release

on:
  workflow_call:
    inputs:
      version:
        type: string
        required: true
    secrets:
      HOMEBREW_TAP_TOKEN:
        required: true

concurrency:
  group: publish-please
  queue: max

permissions:
  contents: read

jobs:
  build-linux-x86_64:
    name: linux/x86_64
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
      - name: Build
        run: cargo build --release --locked
      - name: Prepare artifact
        run: |
          mkdir -p dist
          cp target/release/please dist/please-linux-x86_64
      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: please-linux-x86_64
          path: dist/please-linux-x86_64

  build-linux-arm64:
    name: linux/arm64
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - name: Install aarch64 gnu toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu g++-aarch64-linux-gnu
          rustup target add aarch64-unknown-linux-gnu
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
      - name: Build (aarch64-unknown-linux-gnu)
        run: |
          export CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc
          export CC_aarch64_unknown_linux_gnu=aarch64-linux-gnu-gcc
          export CXX_aarch64_unknown_linux_gnu=aarch64-linux-gnu-g++
          echo "Configured cross linker"
          cargo build --release --locked --target aarch64-unknown-linux-gnu
      - name: Prepare artifact
        run: |
          mkdir -p dist
          cp target/aarch64-unknown-linux-gnu/release/please dist/please-linux-arm64
      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: please-linux-arm64
          path: dist/please-linux-arm64

  build-macos:
    name: macos
    runs-on: xcode-27
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
      - name: Install Metal toolchain
        run: xcrun -sdk macosx metal --version || xcodebuild -downloadComponent MetalToolchain
      - name: Build
        run: cargo build --release --locked
      - name: Prepare artifact
        run: |
          mkdir -p dist
          cp target/release/please dist/please-darwin-arm64
      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: please-darwin-arm64
          path: dist/please-darwin-arm64

  publish:
    name: publish release
    needs: [build-linux-x86_64, build-linux-arm64, build-macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      RELEASE_VERSION: ${{ inputs.version }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Download Linux artifact
        uses: actions/download-artifact@v8
        with:
          name: please-linux-x86_64
          path: dist
      - name: Download Linux ARM64 artifact
        uses: actions/download-artifact@v8
        with:
          name: please-linux-arm64
          path: dist
      - name: Download macOS artifact
        uses: actions/download-artifact@v8
        with:
          name: please-darwin-arm64
          path: dist
      - name: Compute artifact checksums
        id: sums
        shell: bash
        run: |
          set -euo pipefail
          linux_amd64_sha=$(sha256sum dist/please-linux-x86_64 | awk '{print $1}')
          linux_arm64_sha=$(sha256sum dist/please-linux-arm64 | awk '{print $1}')
          darwin_arm64_sha=$(sha256sum dist/please-darwin-arm64 | awk '{print $1}')
          echo "sha_linux_x86_64=$linux_amd64_sha" >> "$GITHUB_OUTPUT"
          echo "sha_linux_arm64=$linux_arm64_sha" >> "$GITHUB_OUTPUT"
          echo "sha_darwin_arm64=$darwin_arm64_sha" >> "$GITHUB_OUTPUT"

      - name: Checkout Homebrew tap
        uses: actions/checkout@v7
        with:
          repository: xhjkl/homebrew-made
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          path: tap

      - name: Render Homebrew formula
        shell: bash
        env:
          DARWIN_ARM64_SHA: ${{ steps.sums.outputs.sha_darwin_arm64 }}
          LINUX_X86_64_SHA: ${{ steps.sums.outputs.sha_linux_x86_64 }}
          LINUX_ARM64_SHA: ${{ steps.sums.outputs.sha_linux_arm64 }}
        run: |
          set -euo pipefail
          mkdir -p tap/Formula
          sed \
            -e "s|¶version|$RELEASE_VERSION|g" \
            -e "s|¶sha256_darwin_arm64|$DARWIN_ARM64_SHA|g" \
            -e "s|¶sha256_linux_x86_64|$LINUX_X86_64_SHA|g" \
            -e "s|¶sha256_linux_arm64|$LINUX_ARM64_SHA|g" \
            homebrew/Formula/please.rb > tap/Formula/please.rb

      - name: Create GitHub release
        id: publish
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # Checks can finish out of order. Latest and Homebrew follow the newer version.
          latest_tag=$(gh api graphql -f owner="${GITHUB_REPOSITORY%/*}" -f name="${GITHUB_REPOSITORY#*/}" -f query='
            query($owner: String!, $name: String!) {
              repository(owner: $owner, name: $name) { latestRelease { tagName } }
            }' --jq '.data.repository.latestRelease.tagName // empty')
          newest_version=$(printf '%s\n' "$RELEASE_VERSION" "$latest_tag" |
            grep -E '^[0-9]{4}\.[1-9][0-9]*$' | sort -V | tail -n 1)
          make_latest=false
          if [[ "$RELEASE_VERSION" == "$newest_version" ]]; then
            make_latest=true
          fi
          # Binding the tag first keeps retries on the same commit.
          git push origin "$GITHUB_SHA:refs/tags/$RELEASE_VERSION"
          gh release create "$RELEASE_VERSION" --repo "$GITHUB_REPOSITORY" --verify-tag \
            --title "$RELEASE_VERSION" --notes "" --latest="$make_latest" \
            dist/please-darwin-arm64 dist/please-linux-x86_64 dist/please-linux-arm64
          printf 'latest=%s\n' "$make_latest" >> "$GITHUB_OUTPUT"

      - name: Commit and push tap update
        if: steps.publish.outputs.latest == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git -C tap config user.name "github-actions[bot]"
          git -C tap config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C tap add Formula/please.rb
          if git -C tap diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git -C tap commit -m "please: bump to $RELEASE_VERSION"
          git -C tap push origin HEAD:main
