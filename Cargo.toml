[package]
name = "please"
# Use `YYMM.0.n` for Cargo and `vYYMM.n` for release tags.
version = "2611.0.1"
edition = "2024"
rust-version = "1.99"

[dependencies]
atty = "0.2"
crossterm = "0.29"
eyre = "0.6"
nix = { version = "0.31", features = ["fs", "process", "signal"] }
postcard = { version = "1", features = ["use-std"] }
rustyline = "19"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
thiserror = "2"
time = { version = "0.3", features = ["local-offset", "formatting"] }
tokio = { version = "1", features = ["rt-multi-thread", "full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }

[dev-dependencies]
tokio = { version = "1", features = ["test-util"] }

# The hub: inference, tokenization, and downloading weights.
[target.'cfg(all(target_os = "macos", target_arch = "aarch64"))'.dependencies]
futures-util = "0.3"
reqwest = { version = "0.13", default-features = false, features = [
  "rustls",
  "stream",
] }
metal = "0.33"
oco = { git = "https://github.com/xhjkl/oco", branch = "main" }
sha2 = "0.11"

[profile.release]
opt-level = "z"
debug = false
codegen-units = 1
lto = true
panic = "abort"
strip = true
