[package]
name = "please"
# Use `YYMM.0.n` for Cargo and `YYMM.n` for release tags.
version = "2611.0.28"
edition = "2024"
rust-version = "1.99"

[dependencies]
crossterm = { version = "0.29", default-features = false }
eyre = "0.6"
futures-util = { version = "0.3", default-features = false, features = ["std"] }
nix = { version = "0.32", features = ["fs", "poll", "signal", "term"] }
postcard = { version = "1", default-features = false, features = ["use-std"] }
rustyline = { version = "19", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
thiserror = "2"
time = { version = "0.3", features = ["local-offset"] }
tokio = { version = "1", features = ["io-util", "macros", "net", "process", "rt-multi-thread", "signal", "sync", "time"] }
tracing = { version = "0.1", default-features = false, features = ["std"] }
tracing-subscriber = { version = "0.3", default-features = false, features = ["env-filter", "fmt", "tracing-log"] }

[dev-dependencies]
tokio = { version = "1", features = ["test-util"] }

# The hub: inference, tokenization, and downloading weights.
[target.'cfg(all(target_os = "macos", target_arch = "aarch64"))'.dependencies]
curl = { version = "0.4", default-features = false, features = ["force-system-lib-on-osx"] }
curl-sys = { version = "0.4", default-features = false }
objc2-metal = { version = "0.3.2", default-features = false, features = ["MTLDevice"] }
oco = { git = "https://github.com/xhjkl/oco", branch = "main" }
sha2 = "0.11"

[profile.release]
opt-level = "z"
debug = false
codegen-units = 1
lto = true
panic = "abort"
strip = true
